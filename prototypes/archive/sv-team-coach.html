<div id="sv-coach" class="viz-dotted-background"><main class="phone"><header><b>SV TEAM</b><span>Тренер · Демо</span></header><div id="sv-screen" aria-live="polite"></div></main></div>
<style>
#sv-coach{padding:20px 8px;color-scheme:light dark}#sv-coach .phone{max-width:400px;margin:auto;background:light-dark(#f5f8f8,#10282c);color:light-dark(#12383e,#e8f3f4);border-radius:26px;overflow:hidden;font:16px/1.5 system-ui}#sv-coach header{display:flex;justify-content:space-between;padding:22px;background:light-dark(#123e46,#082127);color:#f8e8a8;gap:10px}#sv-coach header span{font-size:12px;align-self:center}#sv-coach #sv-screen{padding:22px}#sv-coach h2{font-size:24px;font-weight:500;margin:8px 0 20px}#sv-coach p{margin:10px 0}#sv-coach label{display:block;margin:14px 0}#sv-coach input:not([type=checkbox]),#sv-coach select{box-sizing:border-box;width:100%;padding:12px;margin-top:6px;border:1px solid light-dark(#c5d5d8,#4c6970);border-radius:10px;background:light-dark(#fff,#18383f);color:inherit;font:inherit;min-width:0}#sv-coach button{padding:12px 16px;min-height:44px;border:1px solid light-dark(#bdcfd3,#57727a);border-radius:12px;background:light-dark(#fff,#21434b);color:inherit;font:inherit;cursor:pointer}#sv-coach .primary{width:100%;background:light-dark(#164852,#ead391);color:light-dark(#fff,#16313a);border:0;margin-top:20px}#sv-coach .secondary{width:100%;margin-top:10px}#sv-coach .row{padding:14px 0;border-bottom:1px solid light-dark(#dae3e5,#3d555c)}#sv-coach .row label{display:flex;gap:12px;align-items:center;margin:0}#sv-coach .step,#sv-coach .hint{font-size:13px;color:light-dark(#4e6b73,#b1c7cc)}#sv-coach .error{color:light-dark(#a32135,#ffb7bd)}#sv-coach .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}#sv-coach .time{font-variant-numeric:tabular-nums;font-size:24px}#sv-coach .badge{display:inline-block;padding:4px 10px;background:light-dark(#ede4c2,#48502f);border-radius:8px;font-size:13px}
</style>
<script>
(()=>{const root=document.getElementById('sv-coach'),screen=root.querySelector('#sv-screen');let step=0,names=['Алексей Смирнов','Мария Иванова','Данияр Омаров'],selected=new Set([0,1]),attempts={},newForm=false,published=false;const test={discipline:'Плавание',distance:'400',stroke:'Кроль',date:'2026-09-30'};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(id,text,cls='secondary')=>`<button type="button" id="${id}" class="${cls}">${text}</button>`;const parse=s=>{const m=s.trim().match(/^(?:(\d+):)?(\d{1,2})[.,](\d{2})$/);if(!m||+m[2]>59)return null;const v=(+(m[1]||0)*60 + +m[2])*100 + +m[3];return v>0?v:null};const fmt=v=>`${String(Math.floor(v/6000)).padStart(2,'0')}:${String(Math.floor(v/100)%60).padStart(2,'0')}.${String(v%100).padStart(2,'0')}`;const bind=(id,f)=>{const el=screen.querySelector('#'+id);if(el)el.onclick=f};function render(){screen.innerHTML=`<div class="step">${published?'Опубликовано':`Шаг ${step+1} из 4`} · Демонстрационные данные</div>`;if(step===0){screen.innerHTML+=`<h2>Новый старт</h2><label>Дисциплина<select id="discipline"><option>Плавание</option><option>Бег</option></select></label><label>Дистанция, м<input id="distance" type="number" min="1" value="${esc(test.distance)}"></label><label>Стиль<select id="stroke"><option>Кроль</option><option>Брасс</option><option>На спине</option><option>Баттерфляй</option></select></label><label>Дата<input id="date" type="date" value="${esc(test.date)}"></label><div id="err" role="alert" class="error"></div>${btn('next','Выбрать участников','primary')}`;screen.querySelector('#discipline').value=test.discipline;screen.querySelector('#stroke').value=test.stroke;screen.querySelector('#stroke').disabled=test.discipline==='Бег';screen.querySelector('#discipline').onchange=e=>{test.discipline=e.target.value;screen.querySelector('#stroke').disabled=test.discipline==='Бег'};bind('next',()=>{const d=screen.querySelector('#distance').value,date=screen.querySelector('#date').value;if(!(Number(d)>0)||!date){screen.querySelector('#err').textContent='Укажите дистанцию и дату';return}Object.assign(test,{distance:d,date,stroke:screen.querySelector('#stroke').value});step=1;render()})}if(step===1){screen.innerHTML+=`<h2>Участники</h2><label>Поиск<input id="search" placeholder="Имя или фамилия"></label><div id="list">${names.map((n,i)=>`<div class="row" data-name="${esc(n.toLowerCase())}"><label><input type="checkbox" data-i="${i}" ${selected.has(i)?'checked':''}>${esc(n)}</label></div>`).join('')}</div>${btn('add','+ Новый спортсмен')}${newForm?`<label>Имя<input id="first" autocomplete="off"></label><label>Фамилия<input id="last" autocomplete="off"></label><p class="hint">Аккаунт можно пригласить позже</p><div id="err" role="alert" class="error"></div>${btn('saveperson','Создать и добавить','primary')}`:''}<p class="hint" id="count">Выбрано: ${selected.size}</p>${btn('next','К вводу результатов','primary')}${btn('back','Назад')}`;screen.querySelector('#search').oninput=e=>screen.querySelectorAll('[data-name]').forEach(x=>x.hidden=!x.dataset.name.includes(e.target.value.toLowerCase()));screen.querySelectorAll('[data-i]').forEach(e=>e.onchange=()=>{e.checked?selected.add(+e.dataset.i):selected.delete(+e.dataset.i);screen.querySelector('#count').textContent='Выбрано: '+selected.size});bind('add',()=>{newForm=!newForm;render()});bind('saveperson',()=>{const a=screen.querySelector('#first').value.trim(),b=screen.querySelector('#last').value.trim();if(!a||!b){screen.querySelector('#err').textContent='Введите имя и фамилию';return}const n=a+' '+b;names.push(n);selected.add(names.length-1);newForm=false;render()});bind('next',()=>{if(selected.size){step=2;render()}});bind('back',()=>{step=0;render()})}if(step===2){screen.innerHTML+=`<h2>Результаты</h2><p>${esc(test.discipline)} · ${esc(test.distance)} м${test.discipline==='Плавание'?' · '+esc(test.stroke):''}</p><p class="hint">Время: мм:сс.сс · Все попытки сохраняются</p>${[...selected].map(i=>{attempts[i]??=[''];return `<section class="row"><b>${esc(names[i])}</b>${attempts[i].map((v,j)=>`<label>Попытка ${j+1}<input inputmode="decimal" placeholder="06:21.45" data-athlete="${i}" data-attempt="${j}" value="${esc(v)}"></label>`).join('')}<button type="button" data-more="${i}">+ Попытка</button></section>`}).join('')}<div id="err" role="alert" class="error"></div>${btn('next','Проверить результаты','primary')}${btn('draft','Сохранить черновик')}${btn('back','К участникам')}`;screen.querySelectorAll('[data-athlete]').forEach(e=>e.oninput=()=>attempts[e.dataset.athlete][e.dataset.attempt]=e.value);screen.querySelectorAll('[data-more]').forEach(e=>e.onclick=()=>{attempts[e.dataset.more].push('');render()});bind('next',()=>{if([...selected].some(i=>attempts[i].some(v=>parse(v)===null))){screen.querySelector('#err').textContent='Заполните каждую попытку в формате 06:21.45';return}step=3;render()});bind('draft',()=>screen.querySelector('#err').textContent='Черновик сохранён только в текущем прототипе');bind('back',()=>{step=1;render()})}if(step===3){const results=[...selected].map(i=>({i,time:Math.min(...attempts[i].map(parse))})).sort((a,b)=>a.time-b.time);screen.innerHTML+=`<h2>${published?'Рейтинг старта':'Перед публикацией'}</h2><p>${esc(test.distance)} м${test.discipline==='Плавание'?' · '+esc(test.stroke):''} · ${esc(test.date)}</p><span class="badge">${published?'Результаты доступны спортсменам':'Лучшие попытки · '+results.length+' участников'}</span>${results.map((r,j)=>`<div class="row"><p>#${results.findIndex(x=>x.time===r.time)+1} · ${esc(names[r.i])}</p><div class="time">${fmt(r.time)}</div><div class="hint">Попыток: ${attempts[r.i].length}</div></div>`).join('')}${published?btn('restart','Создать ещё один старт','primary'):btn('publish','Опубликовать результаты','primary')}${!published?btn('back','Исправить результаты'):''}`;bind('publish',()=>{published=true;render()});bind('back',()=>{step=2;render()});bind('restart',()=>{step=0;published=false;attempts={};render()})}}render()})();
</script>
