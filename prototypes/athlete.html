<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SV Team · Спортсмен</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#173e46;background:#eaf0ef;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button,a,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #b78e26;outline-offset:3px}.app{max-width:460px;margin:auto;min-height:100dvh;background:#f6f8f6;padding-bottom:90px}header{background:#123e46;color:white;padding:28px 24px 24px;border-radius:0 0 28px 28px}.brand{display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:2px}.demo{font-size:10px;letter-spacing:1px;color:#e9d493;border:1px solid #68807c;padding:5px 8px;border-radius:20px}h1{font-size:27px;line-height:1.2;margin:26px 0 8px;font-weight:600}header p{color:#bbd1d0;font-size:13px;margin:0}.content{padding:22px}label{display:block;font-size:12px;color:#5b7377;margin-bottom:8px}select{width:100%;padding:14px 12px;border:1px solid #d4dfdb;border-radius:12px;background:white;color:#173e46;min-height:48px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:25px 0 12px}h2{font-size:18px;margin:0;font-weight:600}.muted{color:#657c80;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:white;border:1px solid #e0e7e2;border-radius:17px;padding:16px}.pb{background:#f3ebd3;border-color:#e4d6af}.caption{font-size:11px;color:#5b7172}.value{font-variant-numeric:tabular-nums;font-size:25px;font-weight:600;margin:9px 0 4px}.detail{font-size:11px;color:#637b7c}.change{color:#26765b;font-size:12px;margin-top:16px}.chart{padding:16px 12px}.chart svg{width:100%;height:auto;display:block}.point{fill:#fff;stroke:#267469;stroke-width:3;cursor:pointer}.point:focus{stroke:#bc9128;stroke-width:5}.selection{padding:10px 4px 0;min-height:38px;font-size:12px;color:#526f72}.segmented{display:flex;background:#e8eeeb;padding:4px;border-radius:10px;gap:3px}.segmented button{flex:1;border:0;border-radius:7px;background:transparent;color:#526d71;font-size:12px;padding:10px 6px;min-height:40px}.segmented button[aria-pressed=true]{background:#fff;color:#173e46;box-shadow:0 2px 5px #173e4610}.history{list-style:none;padding:0;margin:0}.history li{padding:15px 0;border-bottom:1px solid #e2e8e4;display:flex;justify-content:space-between;gap:8px}.history strong{font-variant-numeric:tabular-nums;font-size:18px}.history small{display:block;color:#6c8082;margin-top:5px;font-size:11px}.badge{font-size:10px;background:#eee3be;padding:3px 6px;border-radius:5px;margin-left:6px}.rank-row{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding:16px 10px;align-items:center;border-bottom:1px solid #e5eae6;font-size:13px}.rank-row.me{background:#e9f1ec;border-radius:10px}.rank-row strong{font-variant-numeric:tabular-nums}.note{font-size:11px;line-height:1.6;color:#6c8082;margin-top:18px}.empty{text-align:center;padding:36px 18px;line-height:1.6;color:#60787a}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,460px);background:#fff;border-top:1px solid #dbe4df;display:flex;padding:10px 14px max(12px,env(safe-area-inset-bottom));gap:6px}.nav button,.nav a{flex:1;text-align:center;border:0;background:transparent;padding:12px 4px;border-radius:10px;color:#5b7477;font-size:12px;text-decoration:none}.nav button[aria-current=page]{background:#e9f0eb;color:#123e46;font-weight:600}@media(min-width:600px){.app{margin:24px auto;border-radius:28px;overflow:hidden;box-shadow:0 16px 60px #173e4615}header{border-radius:0 0 28px 28px}}
</style></head><body><main class="app"><header><div class="brand"><b>SV TEAM</b><span class="demo">ДЕМО · СПОРТСМЕН</span></div><h1>Алексей Смирнов</h1><p>Твой результат. Твой следующий шаг.</p></header><div class="content"><label for="category">Категория результата</label><select id="category"></select><section id="view"></section><p class="note">Все имена и результаты — демонстрационные. Данные тренерского прототипа сюда не передаются. Интерфейс сейчас только на русском.</p></div><nav class="nav" aria-label="Основная навигация"><button id="results" aria-current="page">Результаты</button><button id="ranking">Рейтинг</button><a href="index.html">Тренер · демо</a></nav></main>
<script src="athlete-data.js"></script><script>
const athlete='a1',view=document.getElementById('view'),select=document.getElementById('category');let page='results',mode='event',sex='all',range='all';select.innerHTML=SV.categories.map(c=>`<option value="${c.id}">${c.sport} · ${c.label}</option>`).join('');const date=d=>new Date(d+'T12:00:00Z').toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});select.onchange=render;document.getElementById('results').onclick=()=>{page='results';render()};document.getElementById('ranking').onclick=()=>{page='ranking';render()};
function render(){document.getElementById('results').setAttribute('aria-current',page==='results'?'page':'false');document.getElementById('ranking').setAttribute('aria-current',page==='ranking'?'page':'false');const h=SV.history(select.value,athlete);if(page==='ranking'){const rows=SV.leaderboard(select.value,mode,sex);view.innerHTML=`<div class="section-title"><h2>Рейтинг клуба</h2></div><div class="segmented"><button data-mode="event" aria-pressed="${mode==='event'}">Последний старт</button><button data-mode="alltime" aria-pressed="${mode==='alltime'}">За всё время</button></div><label for="sex" style="margin-top:18px">Фильтр по полу</label><select id="sex"><option value="all">Все спортсмены</option><option value="M">Мужчины</option><option value="F">Женщины</option></select><div class="section-title"><span class="muted">${mode==='event'&&rows.length?date(rows[0].date):'Лучший официальный результат'}</span><span class="muted">${rows.length} участников</span></div>${rows.length?rows.map(r=>`<div class="rank-row ${r.athlete===athlete?'me':''}"><span>${r.rank}</span><span>${SV.athletes.find(a=>a.id===r.athlete).name}${r.athlete===athlete?' · ты':''}</span><strong>${SV.format(r.time)}</strong></div>`).join(''):'<div class="card empty">В этой категории ещё нет опубликованных результатов.</div>'}<p class="note">Места при равном времени: 1 / 1 / 2 — без пропусков. All-Time: одна лучшая запись на спортсмена.</p>`;document.getElementById('sex').value=sex;document.getElementById('sex').onchange=e=>{sex=e.target.value;render()};view.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});return;}if(!h.length){view.innerHTML='<div class="section-title"><h2>Твои результаты</h2></div><div class="card empty"><h2>Первый результат впереди</h2><p>Когда тренер опубликует старт в этой категории, здесь появятся история и прогресс.</p></div>';return;}const last=h.at(-1),prev=h.at(-2),pb=Math.min(...h.map(r=>r.time)),delta=prev?prev.time-last.time:null;const filtered=range==='all'?h:h.filter(r=>r.date.slice(0,7)===last.date.slice(0,7));view.innerHTML=`<div class="section-title"><h2>Твои результаты</h2><span class="muted">${h.length} стартов</span></div><div class="grid"><div class="card"><div class="caption">ПОСЛЕДНИЙ СТАРТ</div><div class="value">${SV.format(last.time)}</div><div class="detail">${date(last.date)}</div></div><div class="card pb"><div class="caption">ЛИЧНЫЙ РЕКОРД · PB</div><div class="value">${SV.format(pb)}</div><div class="detail">${last.time===pb?'Рекорд на последнем старте':'Лучшее за всё время'}</div></div></div><p class="change">${delta===null?'Пока нет предыдущего результата для сравнения':delta>0?'Быстрее на '+(delta/100).toFixed(2)+' с · '+(delta/prev.time*100).toFixed(1)+'%':delta<0?'Медленнее на '+(-delta/100).toFixed(2)+' с · '+(-delta/prev.time*100).toFixed(1)+'%':'Без изменения'}${delta===null?'':' относительно предыдущего старта'}</p><div class="section-title"><h2>Прогресс</h2><span class="muted">Меньше время — лучше</span></div><div class="segmented"><button data-range="all" aria-pressed="${range==='all'}">Вся история</button><button data-range="month" aria-pressed="${range==='month'}">Последний месяц данных</button></div><div class="card chart" style="margin-top:12px">${chart(filtered)}<div class="selection" id="selection" aria-live="polite">Нажми на точку, чтобы увидеть результат</div></div><div class="section-title"><h2>История стартов</h2><span class="muted">${filtered.length} записей</span></div><ul class="history">${[...filtered].reverse().map(r=>`<li><div>${date(r.date)}${r.time===pb?'<span class="badge">PB</span>':''}<small>${r.attempts.length} попытк${r.attempts.length===1?'а':'и'} · лучший результат</small><small>${r.attempts.map(a=>a.time?SV.format(a.time):a.status).join(' / ')}</small></div><strong>${SV.format(r.time)}</strong></li>`).join('')}</ul><p class="note">PB и сравнение с предыдущим стартом используют всю историю категории. Фильтр периода меняет график и список. Бассейны 25/50 м объединены по решению MVP.</p>`;view.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{range=b.dataset.range;render()});view.querySelectorAll('[data-point]').forEach(p=>{const show=()=>{const r=filtered[+p.dataset.point];document.getElementById('selection').textContent=date(r.date)+' · '+SV.format(r.time)+(r.time===pb?' · PB':'')};p.onclick=show;p.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show()}};});}
function chart(h){const times=h.map(r=>r.time),min=Math.min(...times),max=Math.max(...times),pad=Math.max((max-min)*.2,100),lo=min-pad,hi=max+pad;const start=Date.parse(h[0].date),end=Date.parse(h.at(-1).date);const points=h.map(r=>({x:end===start?195:60+(Date.parse(r.date)-start)/(end-start)*270,y:25+(r.time-lo)/(hi-lo)*135}));return `<svg viewBox="0 0 350 200" role="img" aria-label="График длительности по дате старта; меньше время — лучше">${[0,1,2].map(i=>{const t=lo+(hi-lo)*i/2,y=25+i*67.5;return `<line x1="60" x2="330" y1="${y}" y2="${y}" stroke="#e1e8e3"/><text x="2" y="${y+4}" fill="#708487" font-size="10">${SV.format(Math.round(t)).split('.')[0]}</text>`}).join('')}<polyline points="${points.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="#267469" stroke-width="2.5"/>${points.map((p,i)=>`<circle class="point" cx="${p.x}" cy="${p.y}" r="7" tabindex="0" role="button" data-point="${i}" aria-label="${date(h[i].date)}, ${SV.format(h[i].time)}"/>`).join('')}<text x="60" y="189" fill="#708487" font-size="10">${h[0].date.slice(5)}</text>${h.length>1?`<text x="330" y="189" text-anchor="end" fill="#708487" font-size="10">${h.at(-1).date.slice(5)}</text>`:''}</svg>`;}render();
</script></body></html>
