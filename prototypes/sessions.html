<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SV Team · Сессии старта</title></head><body>
<div id="sv-sessions" class="viz-dotted-background"></div>
<style>
#sv-sessions{color-scheme:light dark;padding:16px 8px;font:16px/1.5 system-ui;color:light-dark(#173e46,#e4f0ee)}#sv-sessions *{box-sizing:border-box}#sv-sessions .phone{max-width:430px;margin:auto;background:light-dark(#f6f8f6,#122b30);border-radius:24px;overflow:hidden}#sv-sessions header{background:light-dark(#123e46,#0c2227);color:#f3f5eb;padding:24px}#sv-sessions .brand{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;font-size:13px;letter-spacing:1px;color:#e9d493}#sv-sessions .brand span{font-size:11px}#sv-sessions h1{font-size:25px;line-height:1.25;font-weight:500;margin:24px 0 10px}#sv-sessions h2{font-size:19px;font-weight:500;margin:20px 0 12px}#sv-sessions header h1,#sv-sessions header p,#sv-sessions header .badge{color:#f3f5eb}#sv-sessions header p{margin:0 0 18px}#sv-sessions .badge{display:inline-block;font-size:12px;background:light-dark(#294f50,#314b43);padding:7px 10px;border-radius:8px}#sv-sessions .body{padding:20px}#sv-sessions button,#sv-sessions input,#sv-sessions select{font:inherit;color:inherit;border:1px solid light-dark(#c9d9d4,#526d70);background:light-dark(#fff,#1b3b42);border-radius:10px;min-height:44px;padding:10px 12px;max-width:100%}#sv-sessions button{cursor:auto}#sv-sessions button:focus-visible{outline:3px solid #b79942;outline-offset:2px}#sv-sessions button.primary{width:100%;background:light-dark(#154b52,#e9d493);color:light-dark(#fff,#163a41);margin:16px 0 10px}#sv-sessions .tabs{display:flex;gap:6px}#sv-sessions .tabs button{flex:1;font-size:13px;padding:10px 6px}#sv-sessions .tabs button[aria-pressed=true]{background:light-dark(#164750,#d6e9df);color:light-dark(#fff,#123e46)}#sv-sessions .session{width:100%;text-align:left;margin-bottom:10px;padding:14px}#sv-sessions .session-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px}#sv-sessions b,#sv-sessions strong{font-weight:500}#sv-sessions small,#sv-sessions .note{font-size:12px;color:light-dark(#557477,#b3ccca)}#sv-sessions small{display:block;margin-top:5px}#sv-sessions .tag{font-size:11px;border-radius:5px;background:light-dark(#eaf0e8,#344e49);padding:4px 7px}#sv-sessions .heading{margin:20px 0 12px}#sv-sessions .heading h2{margin:0}#sv-sessions .heading span{font-size:12px}#sv-sessions label{display:block;margin:16px 0;font-size:13px}#sv-sessions input,#sv-sessions select{display:block;width:100%;margin-top:6px;min-width:0}#sv-sessions .participant{border-bottom:1px solid light-dark(#dce6df,#456164);padding:16px 0}#sv-sessions .attempt{display:flex;align-items:center;justify-content:space-between;gap:8px}#sv-sessions .attempt input{width:160px;margin:0;font-variant-numeric:tabular-nums}#sv-sessions .quiet{background:transparent;border:0;padding:10px 0;font-size:13px}#sv-sessions .error{color:light-dark(#a52336,#ffb1bb);font-size:13px}#sv-sessions input[aria-invalid=true]{border-color:light-dark(#a52336,#ffb1bb)}#sv-sessions .rank{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid light-dark(#dce6df,#456164)}#sv-sessions .rank div{flex:1;min-width:0;overflow-wrap:anywhere}#sv-sessions .rank strong{font-variant-numeric:tabular-nums;white-space:nowrap}#sv-sessions .place{min-width:18px}#sv-sessions .note{line-height:1.6}
#sv-sessions .time-format{display:flex;align-items:center;gap:8px}#sv-sessions .time-format input[type=checkbox]{display:inline-block;width:16px;height:16px;min-height:0;max-width:none;margin:0;padding:0;flex:0 0 16px;accent-color:light-dark(#164750,#e9d493)}
</style><script src="sessions.js"></script><script src="sessions-ui.js"></script></body></html>
